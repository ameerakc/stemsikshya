<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Coding illustration - laptop with code brackets -->
  <rect x="50" y="50" width="300" height="200" rx="12" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="2"/>
  <rect x="60" y="60" width="280" height="180" rx="8" fill="#1a1a2e" />
  <!-- Code lines -->
  <text x="80" y="100" font-family="monospace" font-size="14" fill="#00d9a5"><code></text>
  <text x="100" y="130" font-family="monospace" font-size="14" fill="#ffffff">const hello = "World";</text>
  <text x="100" y="160" font-family="monospace" font-size="14" fill="#ff6b6b">function build() {</text>
  <text x="120" y="190" font-family="monospace" font-size="14" fill="#ffd93d">return "STEM";</text>
  <text x="100" y="220" font-family="monospace" font-size="14" fill="#ff6b6b">}</text>
  <!-- Brackets decoration -->
  <text x="320" y="130" font-family="monospace" font-size="48" fill="#00d9a5" opacity="0.3">{</text>
  <text x="320" y="200" font-family="monospace" font-size="48" fill="#00d9a5" opacity="0.3">}</text>
  <!-- Keyboard indicator -->
  <rect x="150" y="260" width="100" height="6" rx="3" fill="#333"/>
  <rect x="155" y="260" width="15" height="6" rx="1" fill="#555"/>
  <rect x="175" y="260" width="15" height="6" rx="1" fill="#555"/>
  <rect x="195" y="260" width="15" height="6" rx="1" fill="#555"/>
  <rect x="215" y="260" width="15" height="6" rx="1" fill="#555"/>
  <rect x="235" y="260" width="15" height="6" rx="1" fill="#555"/>
</svg>