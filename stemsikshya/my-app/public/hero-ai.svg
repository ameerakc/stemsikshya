<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- AI illustration - neural network / brain -->
  <rect x="50" y="50" width="300" height="200" rx="12" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="2"/>
  <rect x="60" y="60" width="280" height="180" rx="8" fill="#1a1a2e" />
  <!-- Neural network nodes and connections -->
  <defs>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Connections (lines between nodes) -->
  <g stroke="#a855f7" stroke-width="1.5" opacity="0.4">
    <line x1="120" y1="100" x2="200" y2="100"/>
    <line x1="200" y1="100" x2="280" y2="100"/>
    <line x1="120" y1="100" x2="160" y2="160"/>
    <line x1="200" y1="100" x2="200" y2="160"/>
    <line x1="280" y1="100" x2="240" y2="160"/>
    <line x1="160" y1="160" x2="200" y2="160"/>
    <line x1="200" y1="160" x2="240" y2="160"/>
    <line x1="160" y1="160" x2="180" y2="220"/>
    <line x1="200" y1="160" x2="200" y2="220"/>
    <line x1="240" y1="160" x2="220" y2="220"/>
  </g>
  <!-- Nodes (circles) -->
  <g>
    <!-- Top layer -->
    <circle cx="120" cy="100" r="14" fill="url(#nodeGlow)" opacity="0.9"/>
    <circle cx="120" cy="100" r="8" fill="#fff" opacity="0.3"/>
    <circle cx="200" cy="100" r="14" fill="url(#nodeGlow)" opacity="0.9"/>
    <circle cx="200" cy="100" r="8" fill="#fff" opacity="0.3"/>
    <circle cx="280" cy="100" r="14" fill="url(#nodeGlow)" opacity="0.9"/>
    <circle cx="280" cy="100" r="8" fill="#fff" opacity="0.3"/>
    <!-- Middle layer -->
    <circle cx="160" cy="160" r="12" fill="url(#nodeGlow)" opacity="0.8"/>
    <circle cx="160" cy="160" r="6" fill="#fff" opacity="0.3"/>
    <circle cx="200" cy="160" r="16" fill="url(#nodeGlow)" opacity="1"/>
    <circle cx="200" cy="160" r="10" fill="#fff" opacity="0.4"/>
    <circle cx="240" cy="160" r="12" fill="url(#nodeGlow)" opacity="0.8"/>
    <circle cx="240" cy="160" r="6" fill="#fff" opacity="0.3"/>
    <!-- Bottom layer -->
    <circle cx="180" cy="220" r="14" fill="url(#nodeGlow)" opacity="0.9"/>
    <circle cx="180" cy="220" r="8" fill="#fff" opacity="0.3"/>
    <circle cx="220" cy="220" r="14" fill="url(#nodeGlow)" opacity="0.9"/>
    <circle cx="220" cy="220" r="8" fill="#fff" opacity="0.3"/>
  </g>
  <!-- Brain outline silhouette -->
  <path d="M200 80 C150 80 120 120 120 160 C120 200 160 230 200 230 C240 230 280 200 280 160 C280 120 250 80 200 80 Z" 
        stroke="#a855f7" stroke-width="2" fill="none" opacity="0.3" stroke-dasharray="8,4"/>
</svg>